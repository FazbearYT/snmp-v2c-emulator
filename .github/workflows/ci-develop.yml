name: CI / develop push
on:
  push:
    branches: [develop]
env:
  UV_VERSION: "0.12.24"
permissions:
  contents: read

jobs:
  quick:
    name: Develop push / Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install project
        run: uv sync --locked --python "3.13" --extra test --extra quality
      - name: Lint and formatting
        run: |
          uv run --locked --python "3.13" --all-extras ruff check .
          uv run --locked --python "3.13" --all-extras ruff format --check .
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth
      - name: Run quick regression tests
        env:
          SNMP_GUI_REQUIRED: "1"
        run: >-
          xvfb-run -a uv run --locked --python "3.13" --extra test pytest -q
