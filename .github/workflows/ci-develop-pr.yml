name: CI / develop PR
on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
env:
  UV_VERSION: "0.12.24"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ !github.event.pull_request.draft }}
    name: Develop PR / Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install project
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra test
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth
      - name: Run tests with coverage
        env:
          SNMP_GUI_REQUIRED: "1"
        run: >-
          xvfb-run -a uv run --locked --python "${{ matrix.python-version }}" --extra test
          pytest --cov=snmp_emulator --cov-report=term-missing --cov-fail-under=85

  windows:
    if: ${{ !github.event.pull_request.draft }}
    name: Develop PR / Windows Python 3.13
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$env:UV_VERSION"
      - name: Install project
        run: uv sync --locked --python "3.13" --extra test
      - name: Run tests
        env:
          SNMP_GUI_REQUIRED: "1"
        run: uv run --locked --python "3.13" --extra test pytest -q

  quality:
    if: ${{ !github.event.pull_request.draft }}
    name: Develop PR / Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Check lock file
        run: uv lock --check
      - name: Install project
        run: uv sync --locked --python "3.13" --extra test --extra quality
      - name: Lint
        run: uv run --locked --python "3.13" --all-extras ruff check .
      - name: Check formatting
        run: uv run --locked --python "3.13" --all-extras ruff format --check .
      - name: Validate sample configurations
        run: |
          uv run --locked --python "3.13" --all-extras \
            python -m snmp_emulator --config examples/device.yaml --check-config
          for scenario in stable temperature-jump cpu-step; do
            uv run --locked --python "3.13" --all-extras \
              python -m snmp_emulator --device-config examples/device.json \
              --scenario "examples/$scenario.json" --check-config
          done
          uv run --locked --python "3.13" --all-extras \
            python -m snmp_emulator --device-config examples/device-emergency.json \
            --scenario examples/recovery.json --check-config
