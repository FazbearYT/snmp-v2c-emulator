name: CI

env:
  UV_VERSION: "0.12.24"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install project
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra test
      - name: Run tests
        run: >-
          uv run --locked --python "${{ matrix.python-version }}" --extra test
          pytest --cov=snmp_emulator --cov-report=term-missing --cov-fail-under=85

  quality:
    name: Quality and package build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Check lock file
        run: uv lock --check
      - name: Install project
        run: uv sync --locked --python "3.13" --extra test --extra quality
      - name: Lint
        run: uv run --locked --python "3.13" --all-extras ruff check .
      - name: Check formatting
        run: uv run --locked --python "3.13" --all-extras ruff format --check .
      - name: Audit workflow security
        run: uv run --locked --python "3.13" --all-extras zizmor .github/workflows/ci.yml
      - name: Audit Python dependencies
        run: |
          uv export --quiet --locked --all-extras --no-emit-project \
            --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uv run --locked --python "3.13" --all-extras \
            pip-audit --strict --requirement "$RUNNER_TEMP/audit-requirements.txt"
      - name: Validate example configuration
        run: >-
          uv run --locked --python "3.13" --all-extras
          python -m snmp_emulator --config examples/device.yaml --check-config
      - name: Build package
        run: uv build --clear
      - name: Validate package metadata
        run: uv run --locked --python "3.13" --all-extras twine check --strict dist/*
      - name: Test installed wheel
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .package-venv/bin/python -m pip check
          .package-venv/bin/snmp-emulator --version
          .package-venv/bin/snmp-emulator --config examples/device.yaml --check-config
          .package-venv/bin/python tests/installed_smoke.py
