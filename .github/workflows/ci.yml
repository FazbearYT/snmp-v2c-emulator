name: CI

env:
  UV_VERSION: "0.12.24"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install project
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra test
      - name: Run tests
        run: >-
          uv run --locked --python "${{ matrix.python-version }}" --extra test
          pytest --cov=snmp_emulator --cov-report=term-missing --cov-fail-under=85

  quality:
    name: Quality and package build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Check lock file
        run: uv lock --check
      - name: Install project
        run: uv sync --locked --python "3.13" --extra test --extra quality
      - name: Lint
        run: uv run --locked --python "3.13" --all-extras ruff check .
      - name: Check formatting
        run: uv run --locked --python "3.13" --all-extras ruff format --check .
      - name: Audit workflow security
        run: uv run --locked --python "3.13" --all-extras zizmor .github/workflows/ci.yml
      - name: Audit Python dependencies
        run: |
          uv export --quiet --locked --all-extras --no-emit-project \
            --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uv run --locked --python "3.13" --all-extras \
            pip-audit --strict --requirement "$RUNNER_TEMP/audit-requirements.txt"
      - name: Validate example configuration
        run: >-
          uv run --locked --python "3.13" --all-extras
          python -m snmp_emulator --config examples/device.yaml --check-config
      - name: Build package
        run: uv build --clear
      - name: Validate package metadata
        run: uv run --locked --python "3.13" --all-extras twine check --strict dist/*
      - name: Test installed distributions
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install \
            --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-venv/bin/snmp-emulator" --version
          "$RUNNER_TEMP/wheel-venv/bin/snmp-emulator" \
            --config examples/device.yaml --check-config
          "$RUNNER_TEMP/wheel-venv/bin/python" tests/installed_smoke.py
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install \
            --disable-pip-version-check dist/*.tar.gz
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip check
          "$RUNNER_TEMP/sdist-venv/bin/snmp-emulator" --version
          "$RUNNER_TEMP/sdist-venv/bin/snmp-emulator" \
            --config examples/device.yaml --check-config
          "$RUNNER_TEMP/sdist-venv/bin/python" tests/installed_smoke.py

  windows:
    name: Windows smoke (Python 3.13)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$env:UV_VERSION"
      - name: Install project
        run: uv sync --locked --python "3.13" --extra test
      - name: Run tests
        run: uv run --locked --python "3.13" --extra test pytest -q
      - name: Build package
        run: uv build --clear
      - name: Test installed wheel
        shell: pwsh
        run: |
          $wheel = (Resolve-Path "dist/*.whl").Path
          $venv = Join-Path $env:RUNNER_TEMP "wheel-venv"
          python -m venv $venv
          & "$venv/Scripts/python.exe" -m pip install --disable-pip-version-check $wheel
          & "$venv/Scripts/python.exe" -m pip check
          & "$venv/Scripts/snmp-emulator.exe" --version
          & "$venv/Scripts/snmp-emulator.exe" --config examples/device.yaml --check-config
          & "$venv/Scripts/python.exe" tests/installed_smoke.py
