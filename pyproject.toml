[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "snmp-v2c-emulator"
version = "0.1.0"
description = "Configurable SNMP v2c device emulator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
snmp-emulator = "snmp_emulator.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
