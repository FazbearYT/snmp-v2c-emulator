[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "snmp-v2c-emulator"
version = "0.1.0"
description = "Configurable SNMP v2c device emulator"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
    "pysnmp>=7.1,<8",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<8",
]
quality = [
    "build>=1.2,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
snmp-emulator = "snmp_emulator.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
